version: '3.8'

services:
  web:
    image: 84.247.174.81:5000/phamgia-website:latest
    container_name: phamgia-web
    restart: always
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    networks:
      - webnet

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/dodacphamgia.vn/fullchain.pem:/etc/letsencrypt/live/dodacphamgia.vn/fullchain.pem:ro
      - /etc/letsencrypt/live/dodacphamgia.vn/privkey.pem:/etc/letsencrypt/live/dodacphamgia.vn/privkey.pem:ro
    depends_on:
      - web
    networks:
      - webnet

networks:
  webnet:

